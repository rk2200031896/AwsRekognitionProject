<!DOCTYPE html>
<html>
<head>
  <title>Rekognition Test UI</title>
</head>
<body>
  <h2>Upload Image for Rekognition</h2>
  <input type="file" id="imageInput" accept="image/*" />
  <button onclick="uploadImage()">Analyze</button>

  <h3>Detected Labels:</h3>
  <pre id="result"></pre>

  <script>
    async function uploadImage() {
      const input = document.getElementById('imageInput');
      if (!input.files.length) return alert('Please select an image.');

      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = async function () {
        const base64Image = reader.result.split(',')[1];

        const response = await fetch('https://wst215g8x4.execute-api.us-east-1.amazonaws.com/stage1/rekognition', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image }),
        });

        const result = await response.json();
        document.getElementById('result').innerText = JSON.stringify(result, null, 2);
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
